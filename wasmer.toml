[package]
name = "cincocharlie25/balingasagshs-ams"
version = "0.1.2"
description = "Balingasag Senior High School Attendance and Academic Management System"
entrypoint = "server"

[dependencies]
"php/php" = "^8.3"

[fs]
"/app" = "."

[[command]]
name = "server"
module = "php/php:php"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["-S", "localhost:8080", "-t", "/app", "/app/router.php"]
