name: Validate Wasmer Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - instructor
      - instructor-rbac-requirements

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, mbstring, zip, dom
          coverage: none

      - name: Install validation dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader --ignore-platform-req=php-64bit

      - name: Validate Wasmer configuration inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          required = [
              "WASMER_OWNER",
              "WASMER_APP_NAME",
              "APP_PUBLIC_BASE_URL",
              "DB_HOST",
              "DB_PORT",
              "DB_NAME",
              "DB_USER",
              "DEFAULT_NEW_USER_PASSWORD",
              "API_AUTH_SECRET",
              "API_SYNC_SECRET",
              "RESEND_API_KEY",
              "RESEND_FROM_EMAIL",
          ]
          missing = [key for key in required if not os.environ.get(key)]
          if not os.environ.get("DB_PASS") and not os.environ.get("DB_PASSWORD"):
              missing.append("DB_PASS or DB_PASSWORD")
          if missing:
              raise SystemExit("Missing required GitHub secrets: " + ", ".join(missing))

          if not re.fullmatch(r"[a-z0-9]([-a-z0-9]*[a-z0-9])?", os.environ["WASMER_APP_NAME"]):
              raise SystemExit("WASMER_APP_NAME must use lowercase letters, numbers, and hyphens only.")

          if not os.environ["APP_PUBLIC_BASE_URL"].startswith("https://"):
              raise SystemExit("APP_PUBLIC_BASE_URL must be an https:// URL.")

          app_yaml = Path("app.yaml")
          wasmer_toml = Path("wasmer.toml")
          wasmer_ignore = Path(".wasmerignore")
          if not app_yaml.is_file():
              raise SystemExit("app.yaml is missing.")
          if not wasmer_toml.is_file():
              raise SystemExit("wasmer.toml is missing.")
          if not wasmer_ignore.is_file():
              raise SystemExit(".wasmerignore is missing.")

          text = app_yaml.read_text(encoding="utf-8")
          expected_lines = [
              f'name: {os.environ["WASMER_APP_NAME"]}',
              f'owner: {os.environ["WASMER_OWNER"]}',
              f'  API_ALLOWED_ORIGIN: {json.dumps(os.environ["APP_PUBLIC_BASE_URL"])}',
              f'  APP_PUBLIC_BASE_URL: {json.dumps(os.environ["APP_PUBLIC_BASE_URL"])}',
          ]
          missing_lines = [line for line in expected_lines if line not in text]
          if missing_lines:
              raise SystemExit("Committed app.yaml does not match GitHub secrets: " + ", ".join(missing_lines))

          if "CHANGE_ME_WASMER" in text or "CHANGE_ME_WASMER_APP_URL" in text:
              raise SystemExit("Committed app.yaml still contains Wasmer placeholder values.")

          print("Wasmer Git deployment readiness checks passed.")
          print("Deploy target owner:", os.environ["WASMER_OWNER"])
          print("Deploy target app:", os.environ["WASMER_APP_NAME"])
          print("Public URL:", os.environ["APP_PUBLIC_BASE_URL"])
          PY
        env:
          WASMER_OWNER: ${{ secrets.WASMER_OWNER }}
          WASMER_APP_NAME: ${{ secrets.WASMER_APP_NAME }}
          APP_PUBLIC_BASE_URL: ${{ secrets.APP_PUBLIC_BASE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DEFAULT_NEW_USER_PASSWORD: ${{ secrets.DEFAULT_NEW_USER_PASSWORD }}
          API_AUTH_SECRET: ${{ secrets.API_AUTH_SECRET }}
          API_SYNC_SECRET: ${{ secrets.API_SYNC_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}

      - name: Lint
        run: composer run lint

      - name: Test
        run: composer run test

      - name: Prune development dependencies for deployment
        if: github.ref == 'refs/heads/main' && env.WASMER_TOKEN != ''
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --ignore-platform-req=php-64bit
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}

      - name: Deploy to Wasmer Edge
        if: github.ref == 'refs/heads/main' && env.WASMER_TOKEN != ''
        shell: bash
        run: |
          export WASMER_DIR="$HOME/.wasmer"
          export PATH="$WASMER_DIR/bin:$PATH"

          # Install Wasmer CLI with bounded retries against transient network/TLS connection resets
          installer_tmp="$(mktemp -t wasmer-install.XXXXXX.sh)"
          install_success=0
          max_install_attempts=5
          for install_attempt in $(seq 1 "$max_install_attempts"); do
            echo "Wasmer CLI installation attempt ${install_attempt}/${max_install_attempts}"
            if command -v wasmer >/dev/null 2>&1; then
              install_success=1
              break
            fi
            if curl --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 2 --retry-all-errors -sSfL "https://get.wasmer.io" -o "$installer_tmp" || \
               curl --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 2 --retry-all-errors -sSfL "https://raw.githubusercontent.com/wasmerio/wasmer-install/master/install.sh" -o "$installer_tmp"; then
              if [ -s "$installer_tmp" ] && sh "$installer_tmp"; then
                if [ -x "$WASMER_DIR/bin/wasmer" ]; then
                  install_success=1
                  echo "Wasmer CLI installed successfully."
                  break
                fi
              fi
            fi
            echo "Wasmer CLI installation attempt ${install_attempt} failed."
            if [ "$install_attempt" -eq "$max_install_attempts" ]; then
              rm -f "$installer_tmp"
              echo "::error::Wasmer CLI installation failed after ${max_install_attempts} attempts."
              exit 1
            fi
            sleep_sec=$((install_attempt * 5))
            echo "Retrying Wasmer installation in ${sleep_sec} seconds..."
            sleep "$sleep_sec"
          done
          rm -f "$installer_tmp"

          export WASMER_TOKEN="${WASMER_TOKEN}"
          if wasmer login "${WASMER_TOKEN}"; then
            echo "Wasmer CLI authenticated successfully."
          else
            echo "Wasmer login warning; proceeding to deploy step."
          fi
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Wasmer deployment attempt ${attempt}/${max_attempts}"
            if wasmer deploy --non-interactive --token="${WASMER_TOKEN}"; then
              echo "Wasmer Edge deployment succeeded."
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Wasmer deployment failed after ${max_attempts} attempts."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Wasmer registry request failed; retrying in ${delay} seconds..."
            sleep "$delay"
          done
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
          WASMER_OWNER: ${{ secrets.WASMER_OWNER }}
          WASMER_APP_NAME: ${{ secrets.WASMER_APP_NAME }}
