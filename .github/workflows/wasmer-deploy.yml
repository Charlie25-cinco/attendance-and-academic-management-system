name: Deploy to Wasmer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - instructor
      - instructor-rbac-requirements

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, mbstring, zip, dom
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --ignore-platform-req=php-64bit

      - name: Configure Wasmer app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          required = [
              "WASMER_OWNER",
              "WASMER_APP_NAME",
              "APP_PUBLIC_BASE_URL",
              "DB_HOST",
              "DB_PORT",
              "DB_NAME",
              "DB_USER",
              "DB_PASS",
              "DEFAULT_NEW_USER_PASSWORD",
              "API_AUTH_SECRET",
              "API_SYNC_SECRET",
              "RESEND_API_KEY",
              "RESEND_FROM_EMAIL",
          ]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing required GitHub secrets: " + ", ".join(missing))

          app_env = [
              "DB_HOST",
              "DB_PORT",
              "DB_NAME",
              "DB_USER",
              "DB_PASS",
              "DB_SSL_CA",
              "DB_SSL_CA_CONTENT",
              "DEFAULT_NEW_USER_PASSWORD",
              "FIRST_RUN_ADMIN_PASSWORD",
              "API_AUTH_SECRET",
              "API_SYNC_SECRET",
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USER",
              "SMTP_PASS",
              "SMTP_FROM_EMAIL",
              "SMTP_FROM_NAME",
              "RESEND_API_KEY",
              "RESEND_FROM_EMAIL",
              "RESEND_FROM_NAME",
          ]

          app_yaml = Path("app.yaml")
          text = app_yaml.read_text(encoding="utf-8")
          text = text.replace("CHANGE_ME_WASMER_OWNER", os.environ["WASMER_OWNER"])
          text = text.replace("bshs-ams", os.environ["WASMER_APP_NAME"], 1)
          text = text.replace("https://CHANGE_ME_WASMER_APP_URL", os.environ["APP_PUBLIC_BASE_URL"])
          if os.environ.get("DB_SSL_VERIFY_SERVER_CERT"):
              text = text.replace(
                  '  DB_SSL_VERIFY_SERVER_CERT: "1"',
                  f'  DB_SSL_VERIFY_SERVER_CERT: {json.dumps(os.environ["DB_SSL_VERIFY_SERVER_CERT"])}'
              )
          extra_env = []
          for key in app_env:
              value = os.environ.get(key)
              if value:
                  extra_env.append(f"  {key}: {json.dumps(value)}")
          if extra_env:
              marker = f'  APP_PUBLIC_BASE_URL: {json.dumps(os.environ["APP_PUBLIC_BASE_URL"])}'
              text = text.replace(marker, marker + "\n" + "\n".join(extra_env))
          app_yaml.write_text(text, encoding="utf-8")
          PY
        env:
          WASMER_OWNER: ${{ secrets.WASMER_OWNER }}
          WASMER_APP_NAME: ${{ secrets.WASMER_APP_NAME }}
          APP_PUBLIC_BASE_URL: ${{ secrets.APP_PUBLIC_BASE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_SSL_CA: ${{ secrets.DB_SSL_CA }}
          DB_SSL_CA_CONTENT: ${{ secrets.DB_SSL_CA_CONTENT }}
          DB_SSL_VERIFY_SERVER_CERT: ${{ secrets.DB_SSL_VERIFY_SERVER_CERT }}
          DEFAULT_NEW_USER_PASSWORD: ${{ secrets.DEFAULT_NEW_USER_PASSWORD }}
          FIRST_RUN_ADMIN_PASSWORD: ${{ secrets.FIRST_RUN_ADMIN_PASSWORD }}
          API_AUTH_SECRET: ${{ secrets.API_AUTH_SECRET }}
          API_SYNC_SECRET: ${{ secrets.API_SYNC_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}

      - name: Install Wasmer
        shell: bash
        run: curl https://get.wasmer.io -sSfL | sh

      - name: Deploy
        shell: bash
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
          WASMER_OWNER: ${{ secrets.WASMER_OWNER }}
          WASMER_APP_NAME: ${{ secrets.WASMER_APP_NAME }}
          APP_PUBLIC_BASE_URL: ${{ secrets.APP_PUBLIC_BASE_URL }}
        run: |
          export PATH="$HOME/.wasmer/bin:$PATH"
          echo "Deploy target owner: ${WASMER_OWNER}"
          echo "Deploy target app: ${WASMER_APP_NAME}"
          echo "Public URL: ${APP_PUBLIC_BASE_URL}"
          set +e
          wasmer deploy --non-interactive 2>&1 | tee wasmer-deploy.log
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -q "deployed successfully" wasmer-deploy.log && grep -q "App still not reachable after 5 minutes" wasmer-deploy.log; then
            echo "Wasmer deployment succeeded, but the built-in reachability wait timed out. Treating this as success; verify the live URL manually."
            exit 0
          fi
          if grep -q "Cannot modify a disabled app" wasmer-deploy.log; then
            echo "::error::Wasmer refused the deployment because the target app is disabled. Update the GitHub WASMER_APP_NAME secret to an active Wasmer app name, or re-enable/recreate the app in Wasmer, then rerun this workflow."
          fi
          exit "$status"
