name: Deploy Wasmer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Wasmer
    runs-on: ubuntu-latest
    env:
      WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
      WASMER_OWNER: ${{ secrets.WASMER_OWNER }}
      WASMER_APP_NAME: ${{ secrets.WASMER_APP_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wasmer CLI
        run: curl https://get.wasmer.io -sSfL | sh

      - name: Validate Wasmer token
        run: |
          if [ -z "${WASMER_TOKEN}" ]; then
            echo "WASMER_TOKEN repository secret is missing."
            exit 1
          fi
          if [ -z "${WASMER_OWNER}" ]; then
            echo "WASMER_OWNER repository secret is missing."
            exit 1
          fi
          if [ -z "${WASMER_APP_NAME}" ]; then
            echo "WASMER_APP_NAME repository secret is missing."
            exit 1
          fi

      - name: Deploy app
        run: |
          CLEAN_WASMER_TOKEN="$(printf '%s' "${WASMER_TOKEN}" | tr -d '\r\n')"
          CLEAN_WASMER_OWNER="$(printf '%s' "${WASMER_OWNER}" | tr -d '\r\n')"
          WASMER_TOKEN="${CLEAN_WASMER_TOKEN}" ~/.wasmer/bin/wasmer deploy --non-interactive --owner "${CLEAN_WASMER_OWNER}" --build-remote
